# golangci-lint configuration.
#
# This file is where docs/06-harness.md §1 (the dependency rule) and §2 (the clock
# as a port) stop being prose and become enforcement. A rule a machine does not
# execute is not a rule, it is an intention.
version: "2"

run:
  timeout: 5m
  # Without this, golangci-lint only ever sees the untagged L1/L2 tree:
  # every //go:build integration or //go:build e2e file
  # (test/integration/**, internal/store/sqlite/*_integration_test.go,
  # test/e2e/**) is invisible to errcheck, staticcheck, unused, ineffassign,
  # govet AND depguard, silently exempting them from docs/06-harness.md §6's
  # "the lint does not pass" promise. `golangci-lint run --build-tags
  # integration,e2e ./...` confirms the gap; wiring it here (config, not a
  # CLI flag) is what makes `make lint` / CI's plain `golangci-lint run`
  # pick it up too. A future PR adding a new build tag under test/ must
  # extend this list the same way, or the same gap reopens for that tag.
  build-tags:
    - integration
    - e2e

linters:
  default: standard
  enable:
    - depguard
    - forbidigo
    - errcheck
    - govet
    - ineffassign
    - nolintlint
    - staticcheck
    - unused

  settings:
    # A bare //nolint:depguard would defeat sqlite-containment/core-purity
    # with zero friction and no reviewable trail. Requiring an explanation
    # on every nolint directive (any linter, not just depguard) makes a
    # bypass a visible, commented decision instead of a silent one.
    nolintlint:
      require-explanation: true
      require-specific: true

    # The dependency rule: internal/core is the brain and knows nothing about
    # storage, transport, models or channels. It takes data and returns decisions.
    depguard:
      rules:
        core-purity:
          files:
            - "**/internal/core/**"
          # No allow entry beyond the standard library and core's own packages,
          # so any external dependency is rejected by default rather than by
          # remembering to deny it.
          allow:
            - $gostd
            - github.com/rengo/nooma/internal/core
          deny:
            - pkg: github.com/rengo/nooma/internal/store
              desc: "core must not know about persistence — docs/06-harness.md §1"
            - pkg: github.com/rengo/nooma/internal/providers
              desc: "core must not call models — docs/06-harness.md §1"
            - pkg: github.com/rengo/nooma/internal/channels
              desc: "core must not know about channels — docs/06-harness.md §1"
            - pkg: github.com/rengo/nooma/internal/httpapi
              desc: "core must not know about transport — docs/06-harness.md §1"
            - pkg: github.com/rengo/nooma/internal/ui
              desc: "core must not know about rendering — docs/06-harness.md §1"
            - pkg: github.com/rengo/nooma/internal/scheduler
              desc: "core must not schedule; it decides — docs/06-harness.md §1"
            - pkg: database/sql
              desc: "core must not touch a database — docs/06-harness.md §1"
            - pkg: net/http
              desc: "core must not speak HTTP — docs/06-harness.md §1"
            - pkg: os
              desc: "core must not touch the environment or filesystem — docs/06-harness.md §1"

        # The store's scope boundary, mechanically enforced (design D7/§7.2):
        # only internal/store/** may open a vault, and test/integration/**
        # is a recorded exception — its job is to disprove what only SQLite
        # can disprove, including the control test that must open a
        # connection without the opener's own guarantees.
        sqlite-containment:
          files:
            - $all
            - "!**/internal/store/**"
            - "!**/test/integration/**"
          deny:
            - pkg: github.com/ncruces/go-sqlite3
              desc: "only internal/store opens a vault; FTS5 is opt-in per connection — docs/03-data-model.md"
            - pkg: database/sql
              desc: "only internal/store speaks SQL — docs/06-harness.md §1"

        # m2c design §10.1: R0.1 claimed the dependency rule held at the new
        # ports/store/brain boundary because "the allow-lists already cover
        # these three directories" — verified false. core-purity and
        # sqlite-containment above say nothing about internal/ports or
        # internal/brain, so nothing prevented either from reaching
        # internal/store/sqlite directly (a compiling, lint-passing
        # violation of docs/06-harness.md §1). These two rules close that.
        ports-purity:
          files:
            - "**/internal/ports/**"
          allow:
            - $gostd
            - github.com/rengo/nooma/internal/core
            - github.com/rengo/nooma/internal/ports
          # $gostd alone legalizes net/http, os and os/exec — the same gap
          # core-purity above closes explicitly. Ports are interfaces, not
          # adapters: a port that imports one of these has stopped being a
          # port and started being an implementation.
          deny:
            - pkg: net/http
              desc: "a port declares a contract, it does not speak HTTP — docs/06-harness.md §1"
            - pkg: os
              desc: "a port declares a contract, it does not touch the environment or filesystem — docs/06-harness.md §1"
            - pkg: os/exec
              desc: "a port declares a contract, it does not run a process — docs/06-harness.md §1"

        brain-boundary:
          files:
            - "**/internal/brain/**"
          deny:
            - pkg: github.com/rengo/nooma/internal/store
              desc: "brain reaches persistence only through a port — docs/06-harness.md §1"
            - pkg: github.com/rengo/nooma/internal/providers
              desc: "brain calls a model only through ports.LLMProvider — docs/06-harness.md §1"
            - pkg: github.com/rengo/nooma/internal/httpapi
              desc: "brain does not know about transport — docs/06-harness.md §1"
            - pkg: github.com/rengo/nooma/internal/channels
              desc: "brain does not know about channels — docs/06-harness.md §1"

    # The clock as a port. Scoped to internal/core by the exclusion rule below:
    # adapters legitimately read the real clock, generate ids and read the env.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^time\.Now$'
          msg: "take the current instant through the ports.Clock port — docs/06-harness.md §2"
        - pattern: '^time\.Since$'
          msg: "derive elapsed time from a ports.Clock reading — docs/06-harness.md §2"
        - pattern: '^time\.Until$'
          msg: "derive remaining time from a ports.Clock reading — docs/06-harness.md §2"
        - pattern: '^rand\.'
          msg: "core decisions must be deterministic — docs/06-harness.md §2"
        - pattern: '^uuid\.'
          msg: "take identifiers through the ports.IDGen port — docs/06-harness.md §2"
        - pattern: '^os\.Getenv$'
          msg: "configuration reaches the core as a parameter — docs/06-harness.md §2"

  exclusions:
    generated: lax
    rules:
      # forbidigo applies only inside the cognitive core. Everywhere else, reading
      # the real clock is exactly what an adapter is for.
      - linters:
          - forbidigo
        path-except: internal/core/

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rengo/nooma
