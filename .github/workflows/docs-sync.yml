name: docs-sync

# CLAUDE.md non-negotiable #1, mechanized for the brain's behavior:
# "docs/02-cognitive-core.md governs. If the code and that doc diverge, either
# the code gets fixed or the doc gets updated in the same PR. Never left to
# drift silently."
#
# This job blocks a PR that changes internal/core/** without also changing
# docs/02-cognitive-core.md, unless the PR carries the `no-spec-change` label.
#
# Honest limitation, stated here rather than discovered later: a label-based
# escape hatch is only as strong as the discipline applied to it. Anyone with
# write access can add `no-spec-change` and make this gate disappear. What it
# buys is not prevention — it is that skipping the doc becomes a visible,
# attributable act on the PR instead of an omission nobody notices. The gates
# that structurally cannot be bypassed are the lint rules (§1, §2) and the
# goldens; this one is a prompt, and it is documented as one.
#
# `labeled` and `unlabeled` are in the trigger list on purpose: without them,
# adding the label leaves the failed check stuck red and the PR unmergeable.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: docs-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  spec-sync:
    name: docs<->code sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The diff is computed against the base branch, so its tip must be
          # fetched. fetch-depth: 0 is the simple, robust choice; this repo is
          # small enough that a full clone costs nothing worth optimizing.
          fetch-depth: 0

      - name: core changed without a doc-02 change
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -eu

          changed=$(git diff --name-only "origin/${BASE_REF}"...HEAD)

          core_changed=$(printf '%s\n' "$changed" | grep -c '^internal/core/' || true)
          doc_changed=$(printf '%s\n' "$changed" | grep -c '^docs/02-cognitive-core\.md$' || true)

          if [ "$core_changed" -eq 0 ]; then
            echo "OK: this PR does not touch internal/core/** — nothing for this gate to check."
            exit 0
          fi

          if [ "$doc_changed" -gt 0 ]; then
            echo "OK: internal/core/** changed and docs/02-cognitive-core.md changed with it."
            exit 0
          fi

          if printf '%s' "$LABELS" | grep -q '"no-spec-change"'; then
            echo "OK: internal/core/** changed with no doc-02 change, and the PR carries"
            echo "the no-spec-change label — an explicit, attributable decision."
            exit 0
          fi

          echo "FAIL: this PR changes internal/core/** but not docs/02-cognitive-core.md."
          echo
          echo "internal/core/ holds the brain's decisions, and doc 02 is the source of"
          echo "truth for those decisions (CLAUDE.md non-negotiable #1). If the behavior"
          echo "changed, doc 02 changes in this same PR. If it did not — a refactor, a"
          echo "rename, a pure-performance change — add the no-spec-change label and this"
          echo "check will re-run and pass."
          echo
          echo "Files under internal/core/ in this PR:"
          printf '%s\n' "$changed" | grep '^internal/core/' | sed 's/^/  /'
          exit 1
