name: main

# L4 (e2e) and the cross-compilation matrix. Both run on every pull request
# and on merge to main, per ADR-0013.
#
# They used to run on push to main only, and the reason they no longer do is
# worth keeping: a job that only runs after a merge cannot block the merge that
# broke it. A commit breaking `nooma version`'s output shape reached main green,
# and this workflow turned red afterward — someone had to notice and follow up.
# That was an accepted cost/latency tradeoff while the tree had no
# platform-specific code and one e2e test.
#
# M0 removed the premise. The single-writer lockfile is the first genuinely
# OS-dependent code here (`flock` on unix, `LockFileEx` on Windows, behind build
# tags) and M0's demo claims Linux/macOS/Windows/ARM, so a Windows-only break
# must fail on the PR that introduces it, not on main afterward.
#
# This file stays separate from ci.yml because these two jobs are the slow ones
# and are matrixed; ci.yml holds the fast per-PR gates.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # L4 from docs/06-harness.md §3: compiles the real nooma binary and runs
  # it as a subprocess. See test/e2e/doc.go and test/e2e/version_test.go.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test-e2e

  # docs/06-harness.md §6's cross-compilation matrix, and the direct payoff of
  # ADR-0001: the driver is pure Go/wasm, so every target below builds with
  # CGO_ENABLED=0 and no C toolchain anywhere. spec.md R1.2.
  #
  # The seven targets are fixed by ADR-0013, which supersedes ADR-0001's
  # acceptance criterion 5. That criterion listed four while the same ADR's
  # results table reported "6/6" without naming them; the spike branch's own
  # RESULTS.md names the real six, including linux/arm and excluding
  # windows/arm64. All seven were built from a clean checkout before ADR-0013
  # was written — windows/arm64 is here on measurement, not on inference.
  #
  # `make cross-compile` builds the same seven pairs locally and is part of
  # `make check-all`, so the pre-PR command and this job cannot drift.
  #
  # What this proves and what it does not: it proves the code *builds*
  # everywhere, not that it *works* everywhere. Slice 2 of this change shipped a
  # bug where buildDSN's absoluteness check pattern-matched BOTH POSIX and
  # Windows path shapes regardless of the platform the binary was built for: on
  # POSIX, a Windows-shaped path like "C:/data/vault.db" was wrongly accepted as
  # absolute and silently rewritten to "/C:/data/vault.db" — a *parseable but
  # wrong* DSN that opens a file nobody named, with no error anywhere (fixed in
  # commit 213ef73). A matrix like this one would have compiled that code on
  # every platform without complaint. The bug was found by a manual, empirical
  # probe during review, not by a pre-existing unit test — the regression case
  # (posixStyle rejecting a Windows-drive-shaped path) was added as part of the
  # fix, not before it. (A second, unparseable-DSN defect in the same area was
  # caught and fixed inside this same PR's own review, before it ever reached
  # main — see dsn.go's history for both.) Cross-compilation catches build-tag
  # and syscall mistakes; platform *behavior* needs a test that names the
  # platform.
  cross-compile:
    name: cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm       # 32-bit ARM: Raspberry Pi. Verified by the ADR-0001 spike.
          - goos: darwin
            goarch: amd64     # Intel Macs.
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64     # Windows on ARM. Added on measurement (ADR-0013).
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
