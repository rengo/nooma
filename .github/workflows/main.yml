name: main

# docs/06-harness.md §6: "What does not run on every PR: L4 (e2e), driver
# benchmarks, and the cross-compilation matrix. Those run on merge to the
# main branch and before release." This file is that trigger, kept
# deliberately separate from ci.yml (which runs on every pull_request).
#
# Consequence, written down rather than left implicit: a job that only runs
# after a merge to main cannot block the merge that broke it. A commit that
# breaks `nooma version`'s output shape reaches main green (ci.yml has no L4
# job) and only turns this workflow red afterward — someone has to notice
# and follow up with a fix commit. That is a deliberate cost/latency
# tradeoff for a level that compiles the real binary (L4 is comparatively
# slow and, once the CLI grows, its own kind of flaky), not an oversight.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # L4 from docs/06-harness.md §3: compiles the real nooma binary and runs
  # it as a subprocess. See test/e2e/doc.go and test/e2e/version_test.go.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test-e2e

  # docs/06-harness.md §6's cross-compilation matrix, and the direct payoff of
  # ADR-0001: the driver is pure Go/wasm, so every target below builds with
  # CGO_ENABLED=0 and no C toolchain anywhere. spec.md R1.2.
  #
  # What this proves and what it does not: it proves the code *builds*
  # everywhere, not that it *works* everywhere. Slice 2 of this change shipped a
  # bug where buildDSN produced an unparseable DSN for every Windows absolute
  # path — a matrix like this one would have compiled it happily. That bug was
  # caught by a unit test that constructed a Windows-shaped path and asserted on
  # the parsed URI. Cross-compilation catches build-tag and syscall mistakes;
  # platform *behavior* needs a test that names the platform.
  cross-compile:
    name: cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
