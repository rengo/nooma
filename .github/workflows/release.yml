name: release

# Publishes a release (ADR-0060): the seven binaries, checksums.txt signed
# keyless by cosign, the GitHub Release, and the multi-arch image
# ghcr.io/rengo/nooma. Only a pushed v* tag runs it, never a pull request or
# a merge: the tag goes on a main commit that already passed every gate
# (ADR-0015: tag first, always), so nothing here re-runs them.
on:
  push:
    tags: ["v*"]

# The token writes the release (contents), pushes the image (packages) and
# mints the OIDC identity cosign signs with (id-token). Nothing else.
permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      # The full history: goreleaser reads the previous tag for the changelog.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
      # QEMU runs the arm stages of the image build; buildx builds all three
      # platforms into one manifest.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
