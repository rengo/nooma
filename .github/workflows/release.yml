name: release

# Publishes a release (ADR-0060): the seven binaries, checksums.txt signed
# keyless by cosign, the GitHub Release, and the multi-arch image
# ghcr.io/rengo/nooma. Only a pushed v* tag runs it, never a pull request or
# a merge: the tag goes on a main commit that already passed every gate
# (ADR-0015: tag first, always), so nothing here re-runs them.
#
# This is the one workflow that can publish and sign as the repository, so
# every action is pinned to a commit (its tag in the comment), goreleaser to
# an exact release, and Dockerfile.release's bases to a digest. Bump them by
# hand, resolving the tag to its commit.
on:
  push:
    tags: ["v*"]

# The token writes the release (contents), pushes the image (packages) and
# mints the OIDC identity cosign signs with (id-token). Nothing else.
permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      # The full history: goreleaser reads the previous tag for the changelog.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      # buildx builds the three platforms into one manifest. No QEMU: the
      # image runs nothing on the target platform (Dockerfile.release).
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
