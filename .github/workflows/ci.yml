name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  # Enforces docs/06-harness.md §1 (dependency rule) and §2 (the clock as a port).
  # Without this job those sections are prose.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: go vet
        run: go vet ./...

  # L1 (pure) and L2 (conformance) from docs/06-harness.md §3. Both are untagged,
  # so a plain `go test ./...` runs exactly these two and nothing else.
  test:
    name: test (L1 + L2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -shuffle=on ./...

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...

  # L3 from docs/06-harness.md §3: a real, empty temporary SQLite vault, plus
  # the schema-golden regeneration-diff gate (docs/06-harness.md §6, R4.4):
  # regenerating the golden from the current embedded migrations must change
  # nothing, the same shape as the `templ generate` gate this file's trailing
  # comment still describes as deferred.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: L3 tests
        run: make test-integration
      - name: schema golden regenerates to a clean tree
        run: make schema-golden && git diff --exit-code -- testdata/schema

  # docs/06-harness.md §8 point 5: at least one conformance test per structural
  # invariant (I01, I03, I21), failing red because there is no implementation
  # yet. This job proves test/conformance's pendingimpl-tagged package still
  # fails to compile, and fails for the expected reason — design.md §8
  # (openspec/changes/complete-harness/design.md), spec.md R7.1-R7.3.
  pending-red:
    name: pending-red
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make pending-red

# Gates from docs/06-harness.md §6 that are NOT enforced yet, and what they wait on:
#
#   internal/core coverage floor >= 90% -> waits on core having any statements
#   templ generate leaves a clean tree  -> waits on the UI (M4, ADR-0008)
#   docs<->code sync label check        -> waits on internal/core existing in a PR diff
#   cross-compilation matrix            -> blocked on ADR-0001 closing
#
# They are listed rather than silently absent: a CI file that looks complete but
# enforces half the harness is worse than one that says which half.
