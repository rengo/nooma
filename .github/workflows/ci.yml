name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  # Enforces docs/06-harness.md §1 (dependency rule) and §2 (the clock as a port).
  # Without this job those sections are prose.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: go vet
        run: go vet ./...

  # L1 (pure) and L2 (conformance) from docs/06-harness.md §3. Both are untagged,
  # so a plain `go test ./...` runs exactly these two and nothing else.
  test:
    name: test (L1 + L2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -shuffle=on ./...

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...

  # L3 from docs/06-harness.md §3: a real, empty temporary SQLite vault, plus
  # the schema-golden regeneration-diff gate (docs/06-harness.md §6, R4.4):
  # regenerating the golden from the current embedded migrations must change
  # nothing, the same shape as the `templ generate` gate this file's trailing
  # comment still describes as deferred.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: L3 tests
        run: make test-integration
      - name: schema golden regenerates to a clean tree
        run: make schema-golden && git diff --exit-code -- testdata/schema
  # The same L3 suite on Windows, and the job that would have caught
  # tasks.md §7.7 five slices before it was found: internal/store/sqlite
  # had never worked on Windows, because cross-compilation proves the code
  # BUILDS for a target, never that it behaves there (docs/06-harness.md
  # §6's own sentence).
  #
  # A separate job, never a matrix leg on `integration` above. Matrixing a
  # job renames the check it posts: `integration` is a required context, it
  # would stop posting under that name, and every merge to main would block
  # forever on a check that never arrives.
  #
  # It runs `go test` rather than `make test-integration`, which is the one
  # place in this repo where a CI step restates a Makefile target instead of
  # calling it: `make` is not on PATH on GitHub's Windows runners (measured,
  # not assumed). Keep the two in sync by hand — the target is
  # `test-integration`.
  #
  # No `-race`: the race detector needs a C toolchain on Windows, and what
  # this job exists to prove is platform-specific file and locking behavior,
  # which the raced Linux `integration` job above cannot see. Races are not
  # platform-specific; that coverage is already paid for.
  integration-windows:
    name: integration (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: L3 tests
        run: go test -shuffle=on -tags integration ./internal/store/sqlite/... ./test/integration/...

  # docs/06-harness.md §3's hard floor: >= 90% statement coverage on
  # internal/core/**, and no global floor, because a global number is satisfied
  # by writing useless getter tests. spec.md R8.1.
  #
  # Armed and currently vacuous: internal/core has no statements yet, so the
  # script passes because there is nothing to measure. It says so explicitly
  # rather than printing a bare OK — a green badge earned by an empty package
  # and one earned by a well-covered package must not look the same.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sh scripts/core-coverage.sh

# Gates from docs/06-harness.md §6 that are NOT enforced yet, and what they wait on:
#
#   templ generate leaves a clean tree  -> waits on the UI (M4, ADR-0008)
#   driver benchmarks                   -> ADR-0001's spike lives on an unmerged
#                                          branch by design; no gate re-runs it
#
# They are listed rather than silently absent: a CI file that looks complete but
# enforces half the harness is worse than one that says which half.
#
# Two more §6 gates exist and ARE enforced — just not in this file:
#
#   docs<->code sync           -> docs-sync.yml, because it needs `pull_request`
#                                  label events (`labeled`, `unlabeled`), which
#                                  this file's `pull_request` trigger does not
#                                  listen for.
#   cross-compilation matrix   -> main.yml, on pull_request and on push to main,
#                                  next to the L4 job. Seven targets per
#                                  ADR-0013. ADR-0001 (pure-Go/wasm driver) is
#                                  Accepted; this is its direct payoff, not
#                                  blocked on it.
